<div class="task-card" [class.completed]="task.completed" [class.cosecha]="task.tipo === 'COSECHA'">

   <span class="icon">
      <img [src]="task.image" [alt]="task.title">
   </span>

   <div class="info">
      <h3>
         @if (task.tipo === 'COSECHA') {
            <svg lucideWheat class="cosecha-icon"></svg>
         }
         {{ task.title }}
      </h3>
      <p>{{ task.description }}</p>
   </div>

   <input type="checkbox" [checked]="task.completed" (change)="toggleTask()">

</div>
