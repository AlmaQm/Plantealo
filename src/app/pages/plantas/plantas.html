<div class="plantas-page">

  <app-page-header
    [titulo]="'Inventario'"
    [subtitulo]="plantasFiltradas().length + ' plantas'">
    <div class="plantas-page__filtros">
      <button class="filtro-btn" [class.active]="filtroActivo() === 'TODAS'" (click)="setFiltro('TODAS')">Todas</button>
      <button class="filtro-btn" [class.active]="filtroActivo() === 'INTERIOR'" (click)="setFiltro('INTERIOR')">Interior</button>
      <button class="filtro-btn" [class.active]="filtroActivo() === 'EXTERIOR'" (click)="setFiltro('EXTERIOR')">Exterior</button>
    </div>
  </app-page-header>

  <div class="plantas-page__lista">
    @if (plantasFiltradas().length === 0) {
      <div class="plantas-page__vacio">
        <svg class="vacio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22V13"/>
          <path d="M12 13C12 8 8 5 3 5c0 5 3 9 8 9Z"/>
          <path d="M12 13c0-4 3-7 8-7 0 4-3 7-8 7Z"/>
        </svg>
        <p>¡Anímate a empezar tu pequeño huerto!</p>
        <span>Dale al <strong>+</strong> y añade tu primera planta</span>
      </div>
    }
    @for (planta of plantasFiltradas(); track planta.id) {
      <app-planta-card [planta]="planta" />
    }
  </div>

</div>

<!-- Botón flotante + -->
<button class="fab" (click)="abrirModal()" aria-label="Añadir planta">+</button>

<!-- Overlay -->
@if (modalAbierto()) {
  <div class="modal-overlay" (click)="cerrarModal()"></div>
  <div class="bottomsheet">
    <div class="bottomsheet__handle"></div>

    <div class="bottomsheet__header">
      <h3 class="bottomsheet__titulo">Añadir planta</h3>
      <button class="bottomsheet__cerrar" (click)="cerrarModal()">
        <svg class="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="M6 6 18 18"/>
        </svg>
      </button>
    </div>

    <div class="bottomsheet__body">
      <label class="campo-label">Selecciona una planta</label>
      <app-select-plantas
        [opciones]="opcionesPlantas()"
        [value]="plantaIdSeleccionada()"
        (valueChange)="plantaIdSeleccionada.set($event)" />

      <label class="campo-label" style="margin-top:16px">¿Cuándo la plantaste?</label>
      <app-datepicker
        [value]="fechaSiembra()"
        [max]="hoy"
        (valueChange)="fechaSiembra.set($event)" />
    </div>

    <div class="bottomsheet__footer">
      <button class="btn-cancelar" (click)="cerrarModal()">Cancelar</button>
      <button class="btn-añadir" [disabled]="plantaIdSeleccionada() === null" (click)="agregarPlanta()">
        Añadir
      </button>
    </div>
  </div>
}
